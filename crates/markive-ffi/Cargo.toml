[package]
name = "markive-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Deliberately no `[lints] workspace = true`: the workspace forbids unsafe
# code, and a C ABI boundary is unsafe by nature. The unsafety is confined
# to pointer/CString handling in this crate.

[lib]
crate-type = ["staticlib"]

[dependencies]
markive-core = { path = "../markive-core" }
