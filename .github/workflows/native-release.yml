# Stable native app release: an ad-hoc-signed DMG on every v* tag.
# The app is unsigned for distribution — after download it needs
# `xattr -dr com.apple.quarantine`, same as any unsigned bundle.
#
# workflow_dispatch builds and uploads the DMG as a run artifact without
# creating a release — the dry-run path.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: brew install xcodegen

      - run: xcodebuild -version

      - name: Build markive-ffi (universal)
        run: macos/scripts/build-ffi.sh --universal

      - name: Generate project
        run: xcodegen generate
        working-directory: macos

      - name: Build app (Release, sandboxed)
        run: >
          xcodebuild -project Markive.xcodeproj -scheme Markive
          -configuration Release -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=- build
        working-directory: macos

      - name: Verify architectures and sandbox entitlement, build DMG
        run: |
          app=macos/DerivedData/Build/Products/Release/Markive.app
          lipo -archs "$app/Contents/MacOS/Markive" | tee /dev/stderr | grep -q "x86_64 arm64"
          codesign -d --entitlements - "$app" | grep -q "com.apple.security.app-sandbox"

          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_NAME}" = "${version}" ] && version=dev
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          # Markive icon as the mounted volume's icon; SetFile flags the
          # folder as having a custom icon so Finder honors it.
          cp macos/Resources/AppIcon.icns "$staging/.VolumeIcon.icns"
          SetFile -a C "$staging"
          hdiutil create -volname "Markive" -srcfolder "$staging" -ov -format UDZO \
            "Markive_${version}.dmg"
          echo "DMG=Markive_${version}.dmg" >> "$GITHUB_ENV"

      - name: Upload artifact (dry runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Markive
          path: Markive_*.dmg

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            $0 == heading || index($0, heading " - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > /tmp/changelog-section.md

          {
            cat .github/release-notes/install-unsigned.md
            printf '\n'
            cat /tmp/changelog-section.md
          } > /tmp/release-notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --latest \
            --title "Markive ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            "$DMG"
        env:
          GH_TOKEN: ${{ github.token }}
